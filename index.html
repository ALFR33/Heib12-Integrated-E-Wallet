<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة Heib12 الرقمية الحقيقية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Google Cloud Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-green-500 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-green-500/20">
                    H
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Heib12 <span class="text-green-400 text-xs px-2 py-0.5 rounded-full bg-green-500/10 border border-green-500/20">Wallet</span></h1>
                    <p class="text-xs text-slate-400">بوابة الأرباح والدفع السحابية</p>
                </div>
            </div>
            <div id="user-info-header" class="hidden flex items-center gap-3">
                <span id="user-email-display" class="text-xs text-slate-300"></span>
                <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-xs transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        
        <!-- 1. AUTH SCREEN (Login / Register) -->
        <div id="auth-card" class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl my-8">
            <h2 id="auth-title" class="text-2xl font-bold text-white text-center mb-2">تسجيل الدخول إلى محفظتك</h2>
            <p class="text-xs text-slate-400 text-center mb-6">أدخل بياناتك لإدارة رصيدك على السحابة</p>

            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">البريد الإلكتروني</label>
                    <input type="email" id="auth-email" placeholder="name@example.com" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white text-sm focus:outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">كلمة المرور</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white text-sm focus:outline-none focus:border-green-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-green-500 hover:bg-green-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-green-500/20 text-sm">
                    تسجيل الدخول
                </button>
            </form>

            <div class="mt-6 text-center">
                <button onclick="toggleMode()" id="toggle-btn" class="text-xs text-slate-400 hover:text-green-400 transition">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
            </div>
        </div>

        <!-- 2. WALLET DASHBOARD (Hidden until login) -->
        <div id="wallet-card" class="hidden max-w-2xl mx-auto space-y-6">
            <!-- Balance Card -->
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/40 border border-slate-800 p-6 md:p-8 shadow-2xl">
                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">رصيدك المتاح على السحابة</p>
                <h2 id="wallet-balance" class="text-4xl md:text-5xl font-extrabold text-white mt-2 tracking-tight">$0.00</h2>
            </div>

            <!-- Withdraw to PayPal Section -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-xl">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
                        <i class="fa-brands fa-paypal text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-lg">طلب سحب الأرباح إلى PayPal</h3>
                        <p class="text-xs text-slate-400">أدخل بريد بايبال الخاص بك لتحويل الأرباح إليه</p>
                    </div>
                </div>

                <form onsubmit="requestWithdraw(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">بريد PayPal الخاص بك</label>
                        <input type="email" id="paypal-input" placeholder="your-paypal@email.com" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white text-sm focus:outline-none focus:border-green-500 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">المبلغ المراد سحبه ($)</label>
                        <input type="number" id="withdraw-amount" placeholder="0.00" min="1" step="0.01" required
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white text-sm focus:outline-none focus:border-green-500">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/20 text-sm">
                        <i class="fa-solid fa-paper-plane ml-1"></i> إرسال طلب السحب الفوري
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Firebase & App Script -->
    <script>
        // إعدادات مشروعك الحقيقي في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA3S-Y7dYy_aWJccMJiHfUJkl54vwi6Cis",
            authDomain: "heib12-wallet.firebaseapp.com",
            projectId: "heib12-wallet",
            storageBucket: "heib12-wallet.firebasestorage.app",
            messagingSenderId: "1014785179712",
            appId: "1:1014785179712:web:c7d881672839328ce01fa5",
            measurementId: "G-7XPEBFRV0C"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegister = false;
        let currentUserId = null;

        function toggleMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').textContent = isRegister ? 'إنشاء حساب جديد في Heib12' : 'تسجيل الدخول إلى محفظتك';
            document.getElementById('auth-btn').textContent = isRegister ? 'تسجيل وحفظ الحساب' : 'تسجيل الدخول';
            document.getElementById('toggle-btn').textContent = isRegister ? 'لديك حساب؟ سجل دخولك' : 'ليس لديك حساب؟ أنشئ حساباً جديداً';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;

            try {
                let userCred;
                if (isRegister) {
                    userCred = await auth.createUserWithEmailAndPassword(email, pass);
                    // إنشاء محفظة أولية للمستخدم في قاعدة بيانات السحابة Firestore
                    await db.collection('wallets').doc(userCred.user.uid).set({
                        email: email,
                        balance: 50.00, // مكافأة ترحيبية تجريبية
                        createdAt: new Date()
                    });
                    alert('تم إنشاء الحساب والمحفظة بنجاح!');
                } else {
                    userCred = await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch (err) {
